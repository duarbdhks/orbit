name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 배포기는 이 작업의 check-run 이름(gate)이 success 인 main 커밋만 올린다.
  gate:
    name: gate
    # 공개 저장소가 되면 셀프호스트 러너에서 외부 코드가 돌지 않게 건너뛴다.
    if: ${{ github.event.repository.private }}
    runs-on: [self-hosted, orbit-ci-mac]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Gate (scripts/ci_gate.sh)
        run: bash scripts/ci_gate.sh
