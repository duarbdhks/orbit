name: orbit-ci

services:
  runner:
    image: ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
    container_name: orbit-runner
    restart: unless-stopped
    cpus: 3
    mem_limit: 3g
    networks: [default]
    command: ["bash", "-c", "until [ -f .runner ]; do sleep 1; done; exec ./run.sh"]
